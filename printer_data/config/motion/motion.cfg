########################################
# motion.cfg
# Probing, levelling, resonance & mesh
########################################

#####################################################################
#   Beacon probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_F4344F365154354D38202020FF0A2545-if00
x_offset: 0
y_offset: 27
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 270
home_xy_position: 150, 150
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed

#####################################################################
#   Resonance testing
#####################################################################

[resonance_tester]
accel_chip: beacon
probe_points: 150, 150, 20
accel_per_hz: 150
hz_per_sec: 0.5
max_freq: 200

#####################################################################
#   Input shaper (update after running SHAPER_CALIBRATE)
#####################################################################

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 69.8
shaper_type_y: 2hump_ei
shaper_freq_y: 65.8

#####################################################################
#   Quad gantry level (2.4 — 4-point gantry levelling)
#####################################################################

[quad_gantry_level]
gantry_corners:
    -60, -10
    360, 370
points:
    30, 5
    30, 240
    260, 240
    260, 5
speed: 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
#   QGL two-pass wrapper
#####################################################################

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BASE_QUAD_GANTRY_LEVEL
gcode:
    BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=10 RETRY_TOLERANCE=1
    BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2

#####################################################################
#   Bed mesh
#####################################################################

[bed_mesh]
speed: 400
horizontal_move_z: 10
mesh_min: 30, 30
mesh_max: 270, 270
zero_reference_position: 150, 150
fade_start: 0.6
fade_end: 10.0
probe_count: 25, 25
algorithm: bicubic
adaptive_margin: 5