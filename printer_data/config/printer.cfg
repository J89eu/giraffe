########################################
# Voron 2.4 300mm (EMU)
# Printer name: Giraffe
# MCU: BTT Octopus (STM32F446) via CAN
# Klipper fork: Kalico
########################################

#####################################################################
#   Includes
#####################################################################

# Hardware
[include hardware/toolhead.cfg]
[include hardware/bedfans.cfg]
[include hardware/bed.cfg]
[include hardware/fans.cfg]
[include hardware/sensors.cfg]

# Motion & probing
[include motion/motion.cfg]
[include motion/xy.cfg]
[include motion/z.cfg]

# Macros
[include macros/macros.cfg]
[include macros/speed.cfg]

# UI
[include mainsail.cfg]

# ShakeTune
[include K-ShakeTune/*.cfg]

# MMU (Happy Hare) — uncomment to enable
[include mmu/base/*.cfg]
[include mmu/addons/mmu_eject_buttons.cfg]
[include mmu/optional/client_macros.cfg]
[include mmu/addons/emu_macros.cfg]
#[include mmu/addons/blobifier.cfg]

#####################################################################
#   Kalico / Plugin sections
#####################################################################

[exclude_object]
[shaketune]  # ShakeTune plugin — registers its own commands directly

#####################################################################
#   Firmware retraction
#####################################################################

[firmware_retraction]
retract_length: 0.4
retract_speed: 30
unretract_speed: 30

#####################################################################
#   Arc support
#####################################################################

[gcode_arcs]
resolution: 0.1

#####################################################################
#   MCU
#####################################################################

[mcu]
# CAN bus (active)
#canbus_uuid: da4af6e9d1af
# USB fallback — uncomment if switching back to USB
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_21001B000550314D35323820-if00
restart_method: command

#####################################################################
#   Printer kinematics
#####################################################################

[printer]
kinematics: corexy
max_velocity: 450
max_accel: 10000
max_z_velocity: 25
max_z_accel: 350
square_corner_velocity: 5.0
minimum_cruise_ratio: 0.5

#####################################################################
#   Chamber lighting
#####################################################################

[neopixel Daylight]
pin: PB0
chain_count: 26
color_order: GRB
initial_RED: 0.7
initial_GREEN: 0.0
initial_BLUE: 0.9

#####################################################################
#   Idle timeout
#####################################################################

[idle_timeout]
timeout: 3600  # 1 hour
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z5 F18000.0
        G90
        G1 X{printer.toolhead.axis_maximum.x} Y{printer.toolhead.axis_maximum.y} F18000.0
    {% endif %}
    TURN_OFF_HEATERS        ; bed, hotend (also turns off bed fans via override)
    M107                    ; part cooling fan
    M84                     ; steppers

