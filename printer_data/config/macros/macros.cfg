########################################
# macros.cfg
########################################

#####################################################################
#   Homing helpers
#####################################################################

[gcode_macro CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro G32]
gcode:
    CG28
    QUAD_GANTRY_LEVEL

#####################################################################
#   Print start / end
#####################################################################

[gcode_macro PRINT_START]
gcode:
    {% set BED     = params.BED|int %}
    {% set HOTEND  = params.HOTEND|int %}
    {% set CHAMBER = params.CHAMBER|default(0)|int %}

    CLEAR_PAUSE
    M140 S{BED}                                     ; start bed heating (triggers bed fan logic)
    {% if CHAMBER > 0 %}
        BEDFANSSLOW                                 ; start bed fans early to circulate heat
    {% endif %}
    G28                                             ; full home
    G0 Z2
    G90
    _SET_MPC_MATERIAL MATERIAL={params.MATERIAL}
    SET_DISPLAY_TEXT MSG="Bed: {BED}c"
    M190 S{BED}                                     ; wait for bed temp (triggers bed fans)
    SET_DISPLAY_TEXT MSG="Hotend: 160c"
    M109 S160                                       ; heat nozzle for contact probe
    G28 Z METHOD=CONTACT CALIBRATE=1
    SET_DISPLAY_TEXT MSG="QGL"
    QUAD_GANTRY_LEVEL
    SET_DISPLAY_TEXT MSG="Bed mesh calibrate"
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 RUNS=2
    #CLEANNOZZLE
    G28 Z METHOD=CONTACT CALIBRATE=0
    {% if CHAMBER > 0 %}
        SET_DISPLAY_TEXT MSG="Chamber: waiting {CHAMBER}c"
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER * 0.9}
        SET_DISPLAY_TEXT MSG="Chamber: ready"
    {% endif %}
    SET_DISPLAY_TEXT MSG="Hotend: {HOTEND}c"
    M107                                            ; turn off part cooling fan
    M109 S{HOTEND}                                  ; heat to print temp
    SET_GCODE_OFFSET Z=0.05
    SET_DISPLAY_TEXT MSG="Printing..."

[gcode_macro PRINT_END]
variable_park_x_percent: 0.5   # 50% — centre of X axis
variable_park_y_percent: 0.75  # 75% — clear of rear cables for sensorless homing
gcode:
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    {% set z_park = [z_safe + 18, th.axis_maximum.z]|min %}
    {% set park_x = th.axis_maximum.x * printer['gcode_macro PRINT_END'].park_x_percent %}
    {% set park_y = th.axis_maximum.y * printer['gcode_macro PRINT_END'].park_y_percent %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400
    G92 E0
    G1 E-5.0 F1800                                  ; retract filament
    TURN_OFF_HEATERS                                ; also turns off bed fans via override
    G90
    M107
    G0 Z{z_safe} F20000                            ; quick hop to clear stringing
    G0 Z{z_park} F18000                            ; raise to park height
    G0 X{park_x} Y{park_y} F19500                 ; park toolhead
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

#####################################################################
#   Pause / Resume / Cancel
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}
        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z{z} F900
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F19500
        SAVE_GCODE_STATE NAME=PAUSEPARK
        M104 S0
        SET_IDLE_TIMEOUT TIMEOUT=43200
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(2.5)|int %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=450
        G91
        M83
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900
        {% else %}
            G1 Z{zhop * -1} F900
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=450
        BASE_RESUME
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

#####################################################################
#   Nozzle cleaning
#   Brush at rear — update coordinates to match physical position
#####################################################################

[gcode_macro CLEANNOZZLE]
gcode:
    {% set i = params.I|default(5)|int %}
    {% set s = params.S|default(100)|int %}

    CG28
    SAVE_GCODE_STATE NAME=CLEANNOZZLE
    G90
    G0 X93 Z10 Y304 F19500
    G0 Z-1.2 F19500
    {% for iteration in range(i|int) %}
        G0 X50 F{s*60}
        G0 X93 F{s*60}
    {% endfor %}
    G0 X93 F{s*60}
    G0 Z10 F19500
    RESTORE_GCODE_STATE NAME=CLEANNOZZLE

[gcode_macro SWIPENOZZLE]
gcode:
    CG28
    SAVE_GCODE_STATE NAME=SWIPENOZZLE
    G90
    G0 X93 Z10 Y304 F19500
    G0 Z-1.2 F19500
    G0 X50 F2400
    G0 Z10 F19500
    RESTORE_GCODE_STATE NAME=SWIPENOZZLE

#####################################################################
#   Filament loading / unloading
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set length = params.LENGTH|default(100)|int %}
    SAVE_GCODE_STATE NAME=UNLOADFILAMENT
    CG28
    G90
    G0 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} Z50 F19500
    M109 S230                         ; heat to 230 — safe for most filaments
    M83
    G1 E10 F600                       ; soften tip
    G1 E-{length} F1800               ; retract filament
    RESTORE_GCODE_STATE NAME=UNLOADFILAMENT

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set length = params.LENGTH|default(90)|int %}
    SAVE_GCODE_STATE NAME=LOADFILAMENT
    M109 S230                         ; heat to 230 — safe for most filaments
    M83
    G1 E{length} F600                 ; load filament
    RESTORE_GCODE_STATE NAME=LOADFILAMENT

#####################################################################
#   Filament change (M600)
#####################################################################

[gcode_macro M600]
gcode:
    PAUSE

#####################################################################
#   Spoolman
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
    {% if params.ID %}
        {% set id = params.ID|int %}
        {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
    {% else %}
        {action_respond_info("Parameter 'ID' is required")}
    {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
    {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}

#####################################################################
#   MPC material preset
#####################################################################

[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material
variable_filament_table:
    {
        "PLA"       : ( 1.25, 2.20 ),
        "PETG"      : ( 1.27, 2.20 ),
        "PC+ABS"    : ( 1.15, 2.20 ),
        "ABS"       : ( 1.06, 2.40 ),
        "ASA"       : ( 1.07, 2.10 ),
        "PA6"       : ( 1.12, 2.50 ),
        "PA"        : ( 1.15, 2.50 ),
        "PC"        : ( 1.20, 1.90 ),
        "TPU"       : ( 1.21, 2.00 ),
        "TPU-90A"   : ( 1.15, 2.00 ),
        "TPU-95A"   : ( 1.22, 2.00 ),
        "ABS-CF"    : ( 1.11, 2.40 ),
        "ASA-CF"    : ( 1.11, 2.10 ),
        "PA6-CF"    : ( 1.19, 2.50 ),
        "PC+ABS-CF" : ( 1.22, 2.20 ),
        "PC+CF"     : ( 1.36, 1.90 ),
        "PLA-CF"    : ( 1.29, 2.20 ),
        "PETG-CF"   : ( 1.30, 2.20 ),
        "PC-PBT-GF" : ( 1.30, 2.20 ),
    }
gcode:
    {% set material = params.MATERIAL | upper %}
    {% set heater = params.HEATER | default('extruder') %}
    {% set extruder_config = printer.configfile.settings[heater] %}

    {% if material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}
        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
        {% set density = extruder_config.filament_density %}
        {% set heat_capacity = extruder_config.filament_heat_capacity %}
        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default MPC parameters for {heater}"
    {% endif %}

    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}

#####################################################################
#   Misc
#####################################################################

[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+15}

[gcode_macro RESETSPEEDS]
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}
