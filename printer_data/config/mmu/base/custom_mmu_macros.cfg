## BLOBIFIER MACRO EXTENSIONS — 300mm Voron, nozzle stop @ X28 Y305
## Custom macro to clean the nozzle on the gantry mounted brush after a toolchange
## Invoked by Happy Hare.
#
[gcode_macro _IG_PRE_BLOBIFIER_EXTENSION]
gcode:
    # If already close to the park location, dont park.
    {% set x = printer.gcode_move.gcode_position.x %}
    {% set y = printer.gcode_move.gcode_position.y %}
    {% if (x > 28 or y < 300) %}
      PARK
    {% endif %}
    M400
    MMU_TEST_CONFIG sync_feedback_extrude_threshold=10 QUIET=1

# IG Custom quick-wipe clean macro for nozzle stop / string breaking.
# Runs inside blobifier at tray height, before Z is restored.
#
[gcode_macro _IG_BLOBIFIER_PARK_ON_NOZZLE_LEAK_STOP]
gcode:
  {% set bl = printer['gcode_macro BLOBIFIER'] %}
  {% set safe = printer['gcode_macro _BLOBIFIER_SAFE_DESCEND'] %}
  {% set ignore_safe = safe.print_height < bl.force_safe_descend_height_until %}
  {% if safe.brush or ignore_safe %}
    G90
    # Quick wipe over nozzle stop to break strings and detach any blob remnant
    G1 X29 Y305 F21000
    G1 X54 F21000
    G1 X11  F12000
    G1 X29 F12000
  {% else %}
    # Not safe to descend — just move X clear of the tray
    G1 X{bl.brush_start} F{bl.travel_spd_xy}
  {% endif %}

# IG Full gantry-mounted brush clean macro.
# Runs after Z is restored to print height, where the gantry brush is accessible.
# Set variable_user_post_blobifier_extension: "IG_POST_BLOBIFIER_CLEAN" in blobifier.cfg
#
[gcode_macro _IG_POST_BLOBIFIER_CLEAN]
gcode:
  MMU_TEST_CONFIG sync_feedback_extrude_threshold=3 QUIET=1
  M400
  G90
  G1 X29 Y305.5 F18000
  # Brush nozzle on gantry-mounted brush
  G1 X36 F18000
  G1 X69 F18000
  G1 X36 F18000
  G1 X69 Y304.5 F18000
  G1 X36 F18000
  G1 X69 F18000
  G1 X36 F18000
  G1 X99 F18000
  # Move away from brush
  G1 Y258 F18000
##########################################################################################
[gcode_macro CLEAN_NOZZLE]
gcode:
    PARK
    G90

    # Clean nozzle
    G1 X36 F18000
    G1 X69 F18000
    G1 X36 F18000
    G1 X79 F18000
    G1 X36 F18000
    G1 X69 Y304.5 F18000
    G1 X36 F18000
    G1 X69 F18000
    G1 X36 F18000
    G1 X69 F18000
    G1 X36 F18000
    G1 X99 F18000
    # Move away from brush
    G1 Y258 F18000

# Overriden move to cutter pin macro to enable "un-park" motion to avoid nozzle
# scraping forward on the nozzle stop
#
[gcode_macro _CUT_TIP_MOVE_TO_CUTTER_PIN]
description: Helper to move the toolhead to the target pin in either safe or faster way, depending on toolhead clearance
gcode:
    {% set pin_park_x_loc = params.PIN_PARK_X_LOC|float %}
    {% set pin_park_y_loc = params.PIN_PARK_Y_LOC|float %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set safe_margin_x, safe_margin_y = vars.safe_margin_xy|map('float') %}
    {% set travel_speed = vars['travel_speed']|float %}
    {% set cutting_axis = vars['cutting_axis'] %}

    # IG Changes
    UNPARK

    {% if ((printer.gcode_move.gcode_position.x - pin_park_x_loc)|abs < safe_margin_x) or ((printer.gcode_move.gcode_position.y - pin_park_y_loc)|abs < safe_margin_y) %}
        # Make a safe but slower travel move
        {% if cutting_axis == "x" %}
            G1 X{pin_park_x_loc} F{travel_speed * 60}
            G1 Y{pin_park_y_loc} F{travel_speed * 60}
        {% else %}
            G1 Y{pin_park_y_loc} F{travel_speed * 60}
            G1 X{pin_park_x_loc} F{travel_speed * 60}
        {% endif %}
    {% else %}
        G1 X{pin_park_x_loc} Y{pin_park_y_loc} F{travel_speed * 60}
    {% endif %}

[gcode_macro PARK]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("150")|float %}
  {% set y = params.Y|default("150")|float %}
  {% set f = params.F|default("27000")|int %} #2700

  {% if restore == 1 %}
    # Move to coordinates given by HH as we are restoring position
    G1 X{x} Y{y} F{f}

  {% elif ((printer.gcode_move.gcode_position.x - 31)|abs > 0.05)
        or ((printer.gcode_move.gcode_position.y - 305)|abs > 0.05) %}
    # Perform custom park move to the nozzle stop
    SAVE_GCODE_STATE NAME=SET_PARK_STATE

    {% if (printer.gcode_move.gcode_position.y > 250) and (printer.gcode_move.gcode_position.x > 3) %}
      G1 Y250 F{f}    #Move infront of the end of the nozzle wiper
    {% endif %}
    G1 X15 F{f}              #Move to the start of the nozzle wiper
    G1 X15 Y305 F{f}         #Move to the right Y position aligning with the nozzle wiper
    G1 X31 Y305 F{f}        #Move on the nozzle stop
    RESTORE_GCODE_STATE NAME=SET_PARK_STATE
  {% endif %}

[gcode_macro UNPARK]
gcode:
  {% set f = params.F|default("27000")|int %} #
  # Unpark if on the park location
    SAVE_GCODE_STATE NAME=SET_UNPARK_STATE
    G1 X3 F{f}              #Move to the start of the nozzle wiper
    RESTORE_GCODE_STATE NAME=SET_UNPARK_STATE