########################################
# toolhead.cfg
# Extruder, hotend fan, part cooling fan
########################################

#####################################################################
#   Part cooling fan
#####################################################################

[fan]
pin: PA8
kick_start_time: 0.5

#####################################################################
#   Hotend fan
#####################################################################

[heater_fan hotend_fan]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
tachometer_pin: PG15
tachometer_poll_interval: 0.00004

#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
rotation_distance: 46.6736256
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4
cooling_fan: fan
ambient_temp_sensor: temperature_sensor chamber
filament_density: 1.2
filament_heat_capacity: 1.8
heater_power: 100
control: mpc
block_heat_capacity: 18.8450
sensor_responsiveness: 0.106726
ambient_transfer: 0.208057
fan_ambient_transfer: 0.208057, 0.219961, 0.228721, 0.229468, 0.231919, 0.234063, 0.231583, 0.237858, 0.236736, 0.239435
min_temp: 10
max_temp: 350
max_power: 1.0
min_extrude_temp: 170
pressure_advance: 0.02
pressure_advance_smooth_time: 0.020

[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0